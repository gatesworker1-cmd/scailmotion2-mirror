# Builds the slim pod image from slim/Dockerfile, checks it, pushes it to GHCR. Manual only.
name: build scailmotion2-slim
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag (date)"
        default: ""
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: tag
        id: tag
        run: |
          T="${{ inputs.tag }}"; [ -n "$T" ] || T=$(date -u +%Y-%m-%d)
          echo "tag=$T" >> "$GITHUB_OUTPUT"; echo "image=ghcr.io/${{ github.repository_owner }}/scailmotion2-slim" >> "$GITHUB_OUTPUT"
      - name: build
        run: |
          set -o pipefail
          cd slim
          DOCKER_BUILDKIT=1 docker build --progress=plain -t "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}" . 2>&1 | tail -n 60
          docker image ls "${{ steps.tag.outputs.image }}"
          df -h / | tail -1
      - name: check inside the image (versions, tools, every workflow node type registered)
        run: |
          IMG="${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}"
          docker run --rm --entrypoint bash -v "$PWD/slim/check_nodes.py:/check_nodes.py:ro" "$IMG" -c '
            set -e
            echo "== python"; which python python3 pip; python --version; pip --version
            echo "== torch"; python -c "import torch,torchvision,torchaudio,triton;print(torch.__version__,torchvision.__version__,torchaudio.__version__,\"triton\",triton.__version__,\"cudnn\",torch.backends.cudnn.version())"
            echo "== tools"; for t in jupyter-lab rclone ffmpeg ffprobe curl unzip git g++ nvidia-smi; do printf "%s: " "$t"; which "$t" 2>/dev/null || echo MISSING; done; ffmpeg -version | head -1
            echo "== comfy"; git -C /ComfyUI rev-parse HEAD; for d in /ComfyUI/custom_nodes/*/; do echo "$d $(git -C "$d" rev-parse HEAD)"; done
            echo "== models dir"; find /ComfyUI/models -type f ! -name "put_*" | wc -l
            echo "== pip count"; pip freeze | wc -l
            echo "== sha256 of the CUDA libs (must equal the original: 94f44e2e8fb2d4bc 5192b64e6a1c5916 031ce6c2cbfbb946 10b5e6631cf8115c c3a75b33af334a34 1792291e26d2b27f 43731e24cd89e374 b3d85a0311eadfd3 / torch 2aa4ad61474d40f1 0e54b1db72ce1999 / triton 7a785408ccd36cbf)"
            cd /opt/venv/lib/python3.12/site-packages && for f in nvidia/cudnn/lib/libcudnn.so.9 nvidia/cudnn/lib/libcudnn_engines_precompiled.so.9 nvidia/cublas/lib/libcublas.so.12 nvidia/cublas/lib/libcublasLt.so.12 nvidia/cuda_runtime/lib/libcudart.so.12 nvidia/nccl/lib/libnccl.so.2 nvidia/cuda_nvrtc/lib/libnvrtc.so.12 nvidia/cusparselt/lib/libcusparseLt.so.0 torch/lib/libtorch_cuda.so torch/lib/libc10_cuda.so triton/_C/libtriton.so; do printf "%s  %s\n" "$(sha256sum "$f" | cut -c1-16)" "$f"; done; cd /
            WANT="94f44e2e8fb2d4bc 5192b64e6a1c5916 031ce6c2cbfbb946 10b5e6631cf8115c c3a75b33af334a34 1792291e26d2b27f 43731e24cd89e374 b3d85a0311eadfd3 2aa4ad61474d40f1 0e54b1db72ce1999 7a785408ccd36cbf"
            GOT=$(cd /opt/venv/lib/python3.12/site-packages && for f in nvidia/cudnn/lib/libcudnn.so.9 nvidia/cudnn/lib/libcudnn_engines_precompiled.so.9 nvidia/cublas/lib/libcublas.so.12 nvidia/cublas/lib/libcublasLt.so.12 nvidia/cuda_runtime/lib/libcudart.so.12 nvidia/nccl/lib/libnccl.so.2 nvidia/cuda_nvrtc/lib/libnvrtc.so.12 nvidia/cusparselt/lib/libcusparseLt.so.0 torch/lib/libtorch_cuda.so torch/lib/libc10_cuda.so triton/_C/libtriton.so; do sha256sum "$f" | cut -c1-16; done | tr "\n" " " | sed "s/ $//")
            [ "$GOT" = "$WANT" ] && echo "CUDA/torch/triton libraries: IDENTICAL to the original" || { echo "LIBRARY MISMATCH"; exit 1; }
            echo "== env + ldconfig parity"; env | grep -i "cuda\|nvidia\|LD_\|LIBRARY_PATH\|CMAKE"; ldconfig -p | grep -c tcmalloc; for t in gcc g++ nvcc; do printf "%s: " "$t"; which "$t" 2>/dev/null || echo MISSING; done
            echo "== node check"; python /check_nodes.py
          '
      - name: push as :candidate (the size guard below decides whether it gets the real tag)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="${{ steps.tag.outputs.image }}"; T="${{ steps.tag.outputs.tag }}"
          docker tag "$IMG:$T" "$IMG:candidate"; docker push "$IMG:candidate"
      - name: layer sizes (compressed, what a Vast host downloads) — fail if any layer is over 1.1 GB
        run: |
          IMG="${{ steps.tag.outputs.image }}:candidate"
          docker manifest inspect "$IMG" | python3 -c "
          import json,sys; m=json.load(sys.stdin); L=m.get('layers') or m['manifests']
          tot=0; big=[]
          for l in L:
              tot+=l['size']; print(round(l['size']/1e9,2),'GB', l['digest'][:19])
              if l['size'] > 1.1e9: big.append(l['digest'][:19])
          print('TOTAL compressed', round(tot/1e9,2), 'GB in', len(L), 'layers')
          if big: print('LAYER OVER 1.1 GB:', big); sys.exit(1)"
      - name: publish the real tag (+ latest)
        run: |
          IMG="${{ steps.tag.outputs.image }}"; T="${{ steps.tag.outputs.tag }}"
          docker push "$IMG:$T"; docker tag "$IMG:$T" "$IMG:latest"; docker push "$IMG:latest"
